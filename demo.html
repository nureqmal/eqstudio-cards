<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — EQstudio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060b0a;font-family:sans-serif;min-height:100vh;overflow:hidden}

#demo-watermark{
  position:fixed;top:0;left:0;right:0;z-index:99999;
  background:linear-gradient(135deg,#c9a44a,#e2c06a,#c9a44a);
  color:#060b0a;font-family:sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:9px 20px;height:38px;
}
#demo-watermark a{
  color:#060b0a;text-decoration:none;font-weight:800;
  border-bottom:1px solid rgba(6,11,10,.4);
}

#demo-loading{
  position:fixed;inset:0;top:38px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;color:rgba(240,237,230,.4);font-size:12px;letter-spacing:.2em;
  background:#060b0a;z-index:100;
}
.spinner{
  width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(201,164,74,.2);border-top-color:#c9a44a;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

#demo-error{
  position:fixed;inset:0;top:38px;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:40px;
  color:rgba(240,237,230,.5);background:#060b0a;
}
#demo-error h2{color:#c9a44a;font-size:22px;font-family:serif;font-style:italic;}

/* Iframe fills full viewport below watermark */
#demo-iframe{
  display:none;
  position:fixed;top:38px;left:0;right:0;bottom:0;
  width:100%;height:calc(100vh - 38px);
  border:none;
}
</style>
</head>
<body>

<div id="demo-watermark">
  <span>✦ DEMO SAHAJA — Maklumat adalah rekaan</span>
  <span style="opacity:.4">·</span>
  <a href="https://eqstudio.nreqmal.workers.dev/#tempah">Tempah Kad Anda →</a>
</div>

<div id="demo-loading">
  <div class="spinner"></div>
  <span>MEMUATKAN DEMO...</span>
</div>

<div id="demo-error">
  <h2>Template tidak dijumpai</h2>
  <p style="font-size:13px;margin-top:4px">Demo untuk template ini tidak tersedia.</p>
  <a href="https://eqstudio.nreqmal.workers.dev/#templates" style="color:#c9a44a;margin-top:12px;font-size:13px;">← Kembali ke Katalog</a>
</div>

<iframe id="demo-iframe" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>

<script>
const DUMMY = {
  groom_name:'Izzat', bride_name:'Hana',
  groom_full:'Muhammad Izzat bin Ibrahim', bride_full:'Nur Hana binti Abdullah',
  groom_father:'Ibrahim bin Salleh', groom_mother:'Siti binti Yusof',
  bride_father:'Abdullah bin Hassan', bride_mother:'Aminah binti Ahmad',
  host_family:'Keluarga Ibrahim & Keluarga Abdullah',
  host_family_full:'Keluarga Haji Ibrahim bin Salleh & Keluarga Haji Abdullah bin Hassan',
  host_message_bm:'Dengan penuh kerendahan hati dan rasa syukur ke hadrat Allah SWT, kami menjemput Tuan/Puan hadir ke majlis perkahwinan putera/puteri kami.',
  host_message_en:'With humble hearts and gratitude to Allah SWT, we joyfully invite you to the wedding celebration of our beloved son and daughter.',
  date_display:'10 Ogos 2026', date_day:'Isnin', date_hijri:'16 Safar 1448H',
  date_iso:'2026-08-10T11:00:00', date_yyyymmdd:'20260810',
  time_start:'11:00 PG', time_end:'4:00 PTG',
  time_start_hhmm:'1100', time_end_hhmm:'1600',
  time_arrival:'11:00 PG', time_akad:'11:30 PG',
  time_bersanding:'12:30 TG', time_makan:'1:00 PTG', time_bersurai:'4:00 PTG',
  venue_name:'Dewan Seri Endon', venue_fullname:'Dewan Seri Endon, Presint 10',
  venue_address:'Presint 10, 62250 Putrajaya, Malaysia', venue_city:'Putrajaya',
  venue_waze_query:'Dewan+Seri+Endon+Putrajaya', venue_gmaps_query:'Dewan+Seri+Endon+Putrajaya',
  waze_link:'https://waze.com/ul?q=Dewan+Seri+Endon+Putrajaya',
  gmap_link:'https://maps.google.com/?q=Dewan+Seri+Endon+Putrajaya',
  contact1_name:'Encik Ibrahim', contact1_phone_display:'011-1234 5678', contact1_phone_wa:'601112345678',
  contact2_name:'Puan Aminah', contact2_phone_display:'012-8765 4321', contact2_phone_wa:'601287654321',
  music_url:'', music_label:'A Thousand Years — Christina Perri',
  love_year_1:'2020', love_story_1:'Kami pertama kali berjumpa di universiti semasa Minggu Destini Siswa.',
  love_year_2:'2021', love_story_2:'Selepas banyak projek bersama, perasaan mula bercambah. Kami rasmi hubungan pada hari jadi Hana.',
  love_year_3:'2024', love_story_3:'Izzat melamar Hana di tepi pantai Langkawi. Jawapannya — Ya.',
  love_year_4:'2026',
  dresscode_theme:'Sage Green & Warm Ivory', dresscode_theme_en:'Sage Green & Warm Ivory',
  dresscode_note:'Elakkan warna putih tulen — reserved untuk pengantin',
  color1_hex:'#8a9a5b', color1_name:'Sage', color2_hex:'#c5b99a', color2_name:'Sand',
  color3_hex:'#f0ede6', color3_name:'Ivory', color4_hex:'#d4a574', color4_name:'Champagne',
  color5_hex:'#4a6741', color5_name:'Forest',
  doa_sample1_name:'Kak Lina & Family', doa_sample1_msg:'Semoga perkahwinan ini berkekalan hingga ke syurga. Barakallah!',
  doa_sample2_name:'Pak Long Azman', doa_sample2_msg:'Selamat pengantin baru! Moga murah rezeki dan dikurniakan zuriat yang soleh.',
  qr_code_url:'', hero_url:'', photo1_url:'', photo2_url:'', photo3_url:'',
  opening_url:'', video_url:'', gallery1_url:'', gallery2_url:'', gallery3_url:'', gallery4_url:'', gallery5_url:'',
  order_id:'DEMO0000000000', kad_id:'demo0000000000',
};

function applyDummy(html) {
  // Replace {{PLACEHOLDER}} — case insensitive
  html = html.replace(/\{\{(\w+)\}\}/g, (_, key) => {
    if (DUMMY[key] !== undefined) return DUMMY[key];
    if (DUMMY[key.toLowerCase()] !== undefined) return DUMMY[key.toLowerCase()];
    return '';
  });

  // Fix KAD_ID
  html = html.replace(/const KAD_ID\s*=\s*['"][^'"]*['"]/, "const KAD_ID='demo0000000000'");

  // Neutralize Firebase writes supaya tak buat noise
  html = html.replace(
    /(database|db)\.ref\([^)]*\)\.(set|push|update)\s*\(/g,
    '((()=>Promise.resolve())('
  );

  // Inject CSS untuk block navigation keluar dari demo
  const demoStyle = `<style>
    /* Demo mode — pastikan content visible */
    body { overflow-y: auto !important; }
  </style>`;
  html = html.replace('</head>', demoStyle + '</head>');

  // Inject script untuk block redirect & prevent blank
  const demoScript = `<script>
    // Block navigation supaya iframe tak jadi blank
    window.addEventListener('beforeunload', function(e){ e.preventDefault(); e.returnValue=''; });
    // Override location changes
    (function(){
      const _href = Object.getOwnPropertyDescriptor(window.location, 'href');
      try {
        Object.defineProperty(window.location, 'href', {
          set: function(v){ console.log('[DEMO] blocked navigation to:', v); }
        });
      } catch(e){}
    })();
    // Block window.open yang mungkin cause redirect
    const _open = window.open;
    window.open = function(url, target) {
      if(target === '_self') { console.log('[DEMO] blocked _self open'); return null; }
      return _open.apply(window, arguments);
    };
  <\/script>`;
  html = html.replace('</body>', demoScript + '</body>');

  return html;
}

(async () => {
  const params = new URLSearchParams(location.search);
  const tmpl   = params.get('t');
  const loading = document.getElementById('demo-loading');
  const error   = document.getElementById('demo-error');
  const iframe  = document.getElementById('demo-iframe');

  if (!tmpl) {
    loading.style.display = 'none';
    error.style.display   = 'flex';
    return;
  }

  try {
    const url = 'https://raw.githubusercontent.com/nureqmal/eqstudio-cards/main/templates/' + tmpl + '?v=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error('404');
    const raw  = await res.text();
    const html = applyDummy(raw);

    iframe.srcdoc = html;
    iframe.style.display = 'block';
    loading.style.display = 'none';

  } catch(e) {
    loading.style.display = 'none';
    error.style.display   = 'flex';
  }
})();
</script>
</body>
</html>
