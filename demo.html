<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#060b0a;}
#demo-iframe{position:fixed;inset:0;width:100%;height:100%;border:none;display:none;}
#demo-loading{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:#060b0a;
  color:rgba(240,237,230,.4);font-family:sans-serif;font-size:12px;
  letter-spacing:.2em;text-transform:uppercase;
}
.spinner{
  width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(201,164,74,.2);border-top-color:#c9a44a;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#demo-error{
  position:fixed;inset:0;z-index:200;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:40px;background:#060b0a;color:rgba(240,237,230,.5);
}
#demo-error h2{color:#c9a44a;font-size:22px;font-family:serif;font-style:italic;}
#demo-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(6,11,10,.85);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;animation:overlayIn .4s ease .3s forwards;
}
@keyframes overlayIn{to{opacity:1}}
.demo-card{
  background:linear-gradient(160deg,#0f1a17,#091210);
  border:1px solid rgba(201,164,74,.25);border-radius:4px;
  padding:36px 32px 28px;max-width:340px;width:100%;text-align:center;
  transform:translateY(20px);opacity:0;
  animation:cardIn .4s ease .4s forwards;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.demo-badge{
  display:inline-block;font-family:sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.35em;text-transform:uppercase;color:#060b0a;
  background:linear-gradient(135deg,#c9a44a,#e2c06a);
  padding:5px 14px;border-radius:2px;margin-bottom:20px;
}
.demo-card h2{font-family:Georgia,serif;font-size:22px;font-style:italic;color:#f0ede6;margin-bottom:10px;line-height:1.3;}
.demo-card p{font-family:sans-serif;font-size:12px;color:rgba(240,237,230,.45);line-height:1.8;margin-bottom:24px;}
.demo-card p strong{color:rgba(201,164,74,.7);}
.demo-btn-primary{
  display:block;width:100%;padding:14px;margin-bottom:10px;
  background:linear-gradient(135deg,#c9a44a,#e2c06a,#c9a44a);
  color:#060b0a;font-family:sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.25em;text-transform:uppercase;
  border:none;border-radius:2px;cursor:pointer;text-decoration:none;transition:opacity .2s;
}
.demo-btn-primary:hover{opacity:.85}
.demo-btn-ghost{
  display:block;width:100%;padding:13px;background:transparent;
  color:rgba(240,237,230,.5);font-family:sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.1);border-radius:2px;cursor:pointer;transition:all .2s;
}
.demo-btn-ghost:hover{border-color:rgba(255,255,255,.25);color:rgba(240,237,230,.8);}
.demo-divider{width:32px;height:1px;background:rgba(201,164,74,.2);margin:20px auto 16px;}
.demo-note{font-family:sans-serif;font-size:10px;color:rgba(240,237,230,.2);letter-spacing:.05em;}

(async function() {
  var params = new URLSearchParams(location.search);
  var tmpl = params.get('t');
  var loading = document.getElementById('demo-loading');
  var error = document.getElementById('demo-error');
  var iframe = document.getElementById('demo-iframe');
  if (!tmpl) { loading.style.display = 'none'; error.style.display = 'flex'; return; }
  try {
    var url = 'https://raw.githubusercontent.com/nureqmal/eqstudio-cards/main/templates/' + tmpl;
    var res = await fetch(url);
    if (!res.ok) throw new Error('404');
    var html = applyDummy(await res.text());
    iframe.srcdoc = html;
    iframe.style.display = 'block';
    loading.style.display = 'none';
  } catch(e) {
    console.error('Demo load error:', e, 'template:', tmpl);
    loading.style.display = 'none';
    error.style.display = 'flex';
  }
})();
