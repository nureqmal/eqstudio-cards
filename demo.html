<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — EQstudio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060b0a;font-family:sans-serif;min-height:100vh}

/* WATERMARK */
#demo-watermark{
  position:fixed;top:0;left:0;right:0;z-index:99999;
  background:linear-gradient(135deg,#c9a44a,#e2c06a,#c9a44a);
  color:#060b0a;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.25em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:9px 20px;
}
#demo-watermark a{
  color:#060b0a;text-decoration:none;font-weight:800;
  border-bottom:1px solid rgba(6,11,10,.3);
  transition:opacity .2s;
}
#demo-watermark a:hover{opacity:.7}

/* LOADING */
#demo-loading{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;gap:20px;
  color:rgba(240,237,230,.4);font-family:sans-serif;font-size:13px;letter-spacing:.2em;
}
.demo-spinner{
  width:32px;height:32px;border-radius:50%;
  border:1px solid rgba(201,164,74,.2);
  border-top-color:#c9a44a;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ERROR */
#demo-error{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;gap:16px;text-align:center;padding:40px;
  color:rgba(240,237,230,.5);
}
#demo-error h2{color:#c9a44a;font-size:24px;font-family:serif;}

/* FRAME */
#demo-frame{
  display:none;
  padding-top:38px; /* watermark height */
}
#demo-frame iframe{
  width:100%;border:none;
  height:calc(100vh - 38px);
}
</style>
</head>
<body>

<div id="demo-watermark">
  <span>✦ DEMO SAHAJA</span>
  <span style="opacity:.4">·</span>
  <span>Ini preview template — maklumat adalah rekaan</span>
  <span style="opacity:.4">·</span>
  <a href="https://eqstudio.nreqmal.workers.dev/#tempah">Tempah Kad Anda →</a>
</div>

<div id="demo-loading">
  <div class="demo-spinner"></div>
  <span>MEMUATKAN DEMO...</span>
</div>

<div id="demo-error">
  <h2>Template tidak dijumpai</h2>
  <p>Demo untuk template ini tidak tersedia.</p>
  <a href="https://eqstudio.nreqmal.workers.dev/#templates" style="color:#c9a44a;margin-top:8px;display:inline-block;">← Kembali ke Katalog</a>
</div>

<div id="demo-frame">
  <iframe id="demo-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<script>
// ── DUMMY DATA ──
const DUMMY = {
  // Pengantin
  groom_name:        'Izzat',
  bride_name:        'Hana',
  groom_full:        'Muhammad Izzat bin Ibrahim',
  bride_full:        'Nur Hana binti Abdullah',
  groom_father:      'Ibrahim bin Salleh',
  groom_mother:      'Siti binti Yusof',
  bride_father:      'Abdullah bin Hassan',
  bride_mother:      'Aminah binti Ahmad',

  // Keluarga & Mesej
  host_family:       'Keluarga Ibrahim & Keluarga Abdullah',
  host_family_full:  'Keluarga Haji Ibrahim bin Salleh & Keluarga Haji Abdullah bin Hassan',
  host_message_bm:   'Dengan penuh kerendahan hati dan rasa syukur ke hadrat Allah SWT, kami menjemput Tuan/Puan hadir ke majlis perkahwinan putera/puteri kami.',
  host_message_en:   'With humble hearts and gratitude to Allah SWT, we joyfully invite you to the wedding celebration of our beloved son and daughter.',

  // Tarikh & Masa
  date_display:      '10 Ogos 2026',
  date_day:          'Isnin',
  date_hijri:        '16 Safar 1448H',
  date_iso:          '2026-08-10T11:00:00',
  date_yyyymmdd:     '20260810',
  time_start:        '11:00 PG',
  time_end:          '4:00 PTG',
  time_start_hhmm:   '1100',
  time_end_hhmm:     '1600',
  time_arrival:      '11:00 PG',
  time_akad:         '11:30 PG',
  time_bersanding:   '12:30 TG',
  time_makan:        '1:00 PTG',
  time_bersurai:     '4:00 PTG',

  // Lokasi
  venue_name:        'Dewan Seri Endon',
  venue_fullname:    'Dewan Seri Endon, Presint 10',
  venue_address:     'Presint 10, 62250 Putrajaya, Malaysia',
  venue_city:        'Putrajaya',
  venue_waze_query:  'Dewan+Seri+Endon+Putrajaya',
  venue_gmaps_query: 'Dewan+Seri+Endon+Putrajaya',
  waze_link:         'https://waze.com/ul?q=Dewan+Seri+Endon+Putrajaya',
  gmap_link:         'https://maps.google.com/?q=Dewan+Seri+Endon+Putrajaya',

  // Contact
  contact1_name:          'Encik Ibrahim',
  contact1_phone_display: '011-1234 5678',
  contact1_phone_wa:      '601112345678',
  contact2_name:          'Puan Aminah',
  contact2_phone_display: '012-8765 4321',
  contact2_phone_wa:      '601287654321',

  // Musik
  music_url:   '',
  music_label: 'A Thousand Years — Christina Perri',

  // Kisah cinta
  love_year_1:   '2020',
  love_story_1:  'Kami pertama kali berjumpa di universiti semasa Minggu Destini Siswa. Satu pandangan yang tak terlupakan.',
  love_year_2:   '2021',
  love_story_2:  'Selepas banyak projek bersama, perasaan mula bercambah. Kami rasmi hubungan pada hari jadi Hana.',
  love_year_3:   '2024',
  love_story_3:  'Izzat melamar Hana di tepi pantai Langkawi. Jawapannya satu — Ya.',
  love_year_4:   '2026',

  // Dress code
  dresscode_theme:    'Sage Green & Warm Ivory',
  dresscode_theme_en: 'Sage Green & Warm Ivory',
  dresscode_note:     'Elakkan warna putih tulen — reserved untuk pengantin',
  color1_hex:  '#8a9a5b', color1_name: 'Sage',
  color2_hex:  '#c5b99a', color2_name: 'Sand',
  color3_hex:  '#f0ede6', color3_name: 'Ivory',
  color4_hex:  '#d4a574', color4_name: 'Champagne',
  color5_hex:  '#4a6741', color5_name: 'Forest',

  // Doa sample
  doa_sample1_name: 'Kak Lina & Family',
  doa_sample1_msg:  'Semoga perkahwinan ini berkekalan hingga ke syurga. Barakallah!',
  doa_sample2_name: 'Pak Long Azman',
  doa_sample2_msg:  'Selamat pengantin baru! Moga murah rezeki dan dikurniakan zuriat yang soleh.',

  // Media (kosong untuk demo)
  qr_code_url:  '',
  hero_url:     '',
  photo1_url:   '',
  photo2_url:   '',
  photo3_url:   '',
  opening_url:  '',
  video_url:    '',
  gallery1_url: '',
  gallery2_url: '',
  gallery3_url: '',
  gallery4_url: '',
  gallery5_url: '',

  // Order ID dummy
  order_id: 'DEMO0000000000',
  kad_id:   'demo0000000000',
};

// ── REPLACE PLACEHOLDERS ──
function applyDummy(html) {
  // {{KEY}} format
  html = html.replace(/\{\{(\w+)\}\}/g, (_, key) => {
    const k = key.toLowerCase();
    // cari exact match dulu
    if (DUMMY[key] !== undefined) return DUMMY[key];
    if (DUMMY[k]   !== undefined) return DUMMY[k];
    // fallback
    return '';
  });

  // Fix KAD_ID dalam JS
  html = html.replace(
    /const KAD_ID\s*=\s*'[^']*'/,
    "const KAD_ID='demo0000000000'"
  );

  // Disable Firebase write calls dalam demo (optional — prevent noise)
  html = html.replace(
    /firebase\.database\(\)/g,
    '({ref:()=>({set:()=>{},push:()=>{},on:()=>{},once:()=>Promise.resolve({val:()=>({})})})})'
  );

  return html;
}

// ── MAIN ──
(async () => {
  const params = new URLSearchParams(location.search);
  const tmpl   = params.get('t');

  if (!tmpl) {
    document.getElementById('demo-loading').style.display = 'none';
    document.getElementById('demo-error').style.display   = 'flex';
    return;
  }

  try {
    const base = 'https://raw.githubusercontent.com/nureqmal/eqstudio-cards/main/templates/';
    const res  = await fetch(base + tmpl + '?v=' + Date.now());
    if (!res.ok) throw new Error('not found');
    const raw  = await res.text();
    const html = applyDummy(raw);

    const iframe = document.getElementById('demo-iframe');
    iframe.srcdoc = html;

    document.getElementById('demo-loading').style.display = 'none';
    document.getElementById('demo-frame').style.display   = 'block';

    // Adjust iframe height after load
    iframe.onload = () => {
      try {
        const h = iframe.contentDocument.body.scrollHeight;
        if (h > 200) iframe.style.height = h + 'px';
      } catch(e) {}
    };

  } catch(e) {
    document.getElementById('demo-loading').style.display = 'none';
    document.getElementById('demo-error').style.display   = 'flex';
  }
})();
</script>
</body>
</html>
