<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — EQstudio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#060b0a;}
#demo-iframe{position:fixed;inset:0;width:100%;height:100%;border:none;display:none;}
#demo-loading{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#060b0a;color:rgba(240,237,230,.4);font-family:sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;}
.spinner{width:28px;height:28px;border-radius:50%;border:1px solid rgba(201,164,74,.2);border-top-color:#c9a44a;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#demo-error{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px;background:#060b0a;color:rgba(240,237,230,.5);}
#demo-error h2{color:#c9a44a;font-size:22px;font-family:serif;font-style:italic;}
#demo-overlay{position:fixed;inset:0;z-index:9999;background:rgba(6,11,10,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;animation:overlayIn .4s ease .3s forwards;}
@keyframes overlayIn{to{opacity:1}}
.demo-card{background:linear-gradient(160deg,#0f1a17,#091210);border:1px solid rgba(201,164,74,.25);border-radius:4px;padding:36px 32px 28px;max-width:340px;width:100%;text-align:center;transform:translateY(20px);opacity:0;animation:cardIn .4s ease .4s forwards;}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.demo-badge{display:inline-block;font-family:sans-serif;font-size:9px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;color:#060b0a;background:linear-gradient(135deg,#c9a44a,#e2c06a);padding:5px 14px;border-radius:2px;margin-bottom:20px;}
.demo-card h2{font-family:Georgia,serif;font-size:22px;font-style:italic;color:#f0ede6;margin-bottom:10px;line-height:1.3;}
.demo-card p{font-family:sans-serif;font-size:12px;color:rgba(240,237,230,.45);line-height:1.8;margin-bottom:24px;}
.demo-card p strong{color:rgba(201,164,74,.7);}
.demo-btn-primary{display:block;width:100%;padding:14px;margin-bottom:10px;background:linear-gradient(135deg,#c9a44a,#e2c06a,#c9a44a);color:#060b0a;font-family:sans-serif;font-size:10px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;border:none;border-radius:2px;cursor:pointer;text-decoration:none;transition:opacity .2s;}
.demo-btn-ghost{display:block;width:100%;padding:13px;background:transparent;color:rgba(240,237,230,.5);font-family:sans-serif;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;border:1px solid rgba(255,255,255,.1);border-radius:2px;cursor:pointer;transition:all .2s;}
.demo-btn-ghost:hover{border-color:rgba(255,255,255,.25);color:rgba(240,237,230,.8);}
.demo-divider{width:32px;height:1px;background:rgba(201,164,74,.2);margin:20px auto 16px;}
.demo-note{font-family:sans-serif;font-size:10px;color:rgba(240,237,230,.2);letter-spacing:.05em;}
</style>
</head>
<body>
<div id="demo-loading"><div class="spinner"></div><span>Memuatkan Demo...</span></div>
<div id="demo-error">
  <h2>Template tidak dijumpai</h2>
  <p style="font-size:13px;margin-top:4px">Demo tidak tersedia.</p>
  <a href="https://eqstudio.nreqmal.workers.dev/#templates" style="color:#c9a44a;margin-top:12px;font-size:13px;display:inline-block">← Kembali ke Katalog</a>
</div>
<iframe id="demo-iframe" sandbox="allow-scripts allow-same-origin allow-popups" scrolling="yes"></iframe>
<div id="demo-overlay">
  <div class="demo-card">
    <span class="demo-badge">✦ Preview Demo</span>
    <h2>Ini adalah demo<br>template sahaja</h2>
    <p>Nama, tarikh &amp; maklumat adalah <strong>rekaan semata-mata</strong>.<br>Kad sebenar akan diisi dengan maklumat majlis anda.</p>
    <button class="demo-btn-ghost" onclick="closeOverlay()">Tengok Demo →</button>
    <div class="demo-divider"></div>
    <a href="https://eqstudio.nreqmal.workers.dev/#tempah" class="demo-btn-primary">Tempah Kad Saya</a>
    <p class="demo-note">Siap dalam 48 jam · dari RM29</p>
  </div>
</div>
<script>
function closeOverlay(){
  const el=document.getElementById('demo-overlay');
  el.style.transition='opacity .3s ease';el.style.opacity='0';
  setTimeout(()=>el.remove(),300);
}

function injectDialogs(html) {
  html = html.replace('</head>', DIALOG_CSS_STR + '</head>');
  for(const [id, dialogHtml] of Object.entries(DIALOGS_MAP)) {
    const re = new RegExp('(<(?:section|div|button)[^>]*\\bid="' + id + '"[^>]*>)', 'i');
    html = html.replace(re, (match) => match + '\n' + dialogHtml + '\n');
  }
  return html;
}

function applyDummy(html){
  // Replace placeholders
  html=html.replace(/\{\{(\w+)\}\}/g,(_,key)=>{
    if(DUMMY[key]!==undefined)return DUMMY[key];
    if(DUMMY[key.toLowerCase()]!==undefined)return DUMMY[key.toLowerCase()];
    return'';
  });

  // Fix KAD_ID
  html=html.replace(/const KAD_ID\s*=\s*['"][^'"]*['"]/,"const KAD_ID='demo-preview-mode'");

  // Fix monogram
  html=html.replace(
    /function initMonogram\(\)\{[\s\S]*?\}/,
    "function initMonogram(){const el=document.getElementById('sealInitials');if(el)el.textContent='I & H';}"
  );

  // FIX COUNTDOWN — replace format '20270605T1100:00' dengan betul '2027-06-05T11:00:00'
  html=html.replace(
    /new Date\(['"]20270605T1100:00['"]\)/g,
    "new Date('2027-06-05T11:00:00')"
  );
  // Catch-all — fix any remaining malformed date from placeholder combo
  html=html.replace(
    /new Date\(['"]([0-9]{8})T([0-9]{2})([0-9]{2}):00['"]\)/g,
    function(_,d,h,m){
      var yr=d.slice(0,4),mo=d.slice(4,6),dy=d.slice(6,8);
      return "new Date('"+yr+"-"+mo+"-"+dy+"T"+h+":"+m+":00')";
    }
  );

  // Kosongkan RSVP & doa — override Firebase, buang semua export/CSV stuff
  const firebaseOverride=`<script>
window.addEventListener('load',function(){
  // Kosongkan list
  const r=document.getElementById('rsvpList');if(r)r.innerHTML='';
  const d=document.querySelector('.doa-wall');if(d)d.innerHTML='';
  // Override Firebase supaya tak load/write data lama
  if(window.db){
    window.db.ref=function(){
      const ns={val:()=>null,forEach:()=>{}};
      return{
        on:(e,c)=>{if(e==='value')c(ns);},
        once:()=>Promise.resolve(ns),
        orderByChild:()=>{return{limitToLast:()=>{return{on:(e,c)=>c(ns)}}}}},
        child:()=>{return{
          on:(e,c)=>c(ns),
          set:()=>Promise.resolve(),
          push:()=>{return{set:()=>Promise.resolve()}},
          orderByChild:()=>{return{limitToLast:()=>{return{on:(e,c)=>c(ns)}}}}},
        }},
        set:()=>Promise.resolve(),
        push:()=>{return{set:()=>Promise.resolve()}},
      };
    };
  }
});
<\/script>`;
  html=html.replace('</body>',firebaseOverride+'</body>');

  // Inject dialog boxes
  html=injectDialogs(html);
  return html;
}

(async()=>{
  const params=new URLSearchParams(location.search);
  const tmpl=params.get('t');
  const loading=document.getElementById('demo-loading');
  const error=document.getElementById('demo-error');
  const iframe=document.getElementById('demo-iframe');
  if(!tmpl){loading.style.display='none';error.style.display='flex';return;}
  try{
    const url='https://raw.githubusercontent.com/nureqmal/eqstudio-cards/main/templates/'+tmpl+'?v='+Date.now();
    const res=await fetch(url);
    if(!res.ok)throw new Error('404');
    const html=applyDummy(await res.text());
    iframe.srcdoc=html;
    iframe.style.display='block';
    loading.style.display='none';
  }catch(e){
    loading.style.display='none';
    error.style.display='flex';
  }
})();
</script>
